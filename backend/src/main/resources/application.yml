server:
  port: ${PORT:8082}          # Render injects PORT at runtime

spring:
  datasource:
    # Active database: Docker Postgres (docker-compose.yml, container mim-postgres, host port 5440).
    # Password comes from MIM_PG_PASSWORD (.env, see .env.example).
    url: ${DB_URL:jdbc:postgresql://localhost:5440/mim_erpdb}
    username: ${DB_USER:postgres}
    password: ${MIM_PG_PASSWORD:change-me}

    # --- Previous setups (disabled) ---
    # Neon (cloud Postgres). Set DB_URL / DB_USER / DB_PASS in the environment
    # (jdbc:postgresql://<neon-host>/neondb?sslmode=require); keep credentials out of this file.
    #
    # Older local database (offline dev):
    #   DB_URL=jdbc:postgresql://localhost:5432/merry_erp
    #   DB_USER=postgres
    #   DB_PASS=sys123
    #   (local PostgreSQL 18, D:\Program Files\PostgreSQL\18, port 5432, database merry_erp)
    #
    # DB_URL wins if set; otherwise assembled from Render database parts (host/port/name).
    # url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:merry_erp}}
    # username: ${DB_USER:postgres}
    # password: ${DB_PASS:sys123}
  jpa:
    hibernate:
      ddl-auto: validate          # schema owned by Flyway, JPA only validates
    properties:
      hibernate.format_sql: true
      # Neon's pgbouncer pooler returns an empty search_path; schema-qualify all ORM SQL.
      # Harmless for local Postgres (public is the default schema).
      hibernate.default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public               # pooler search_path is empty; tell Flyway explicitly
    default-schema: public

# CORS for the Next.js dev server / Flutter app
mim:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    # HS256 needs a secret of at least 32 bytes. Override in production.
    secret: ${JWT_SECRET:mim-erp-dev-secret-key-change-me-in-production-0123456789}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:480}
  bootstrap:
    # initial admin created on first run if no admin exists
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
