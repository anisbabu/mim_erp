# Production override:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs in .env: MIM_PG_PASSWORD, JWT_SECRET (>=32 chars), ADMIN_PASSWORD, DOMAIN (erp.example.com, or http://SERVER_IP for no HTTPS), PUBLIC_URL (https://erp.example.com or http://SERVER_IP)
# Only Caddy (80/443) is reachable from outside; db, backend and frontend stay on the internal network.
services:
  db:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${PUBLIC_URL:?set PUBLIC_URL in .env}

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: mim-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
